user_agreement: |
  欢迎使用本机器人服务！
  
  1. 请遵守相关法律法规
  2. 请勿发布违法、违规内容
  3. 请勿恶意攻击、骚扰他人
  4. 请勿发送垃圾信息、广告
  5. 违反规定将被限制使用
  
  使用本服务即表示您同意以上条款。

privacy_policy: |
  我们重视您的隐私：
  
  1. 我们仅收集必要的用户信息
  2. 您的信息仅用于提供服务
  3. 我们不会向第三方泄露您的信息
  4. 您可以随时要求删除您的信息
  5. 我们采取合理措施保护您的数据安全
  
  如有疑问，请联系管理员。